name: SMTP-framed proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # every 5 hours - keeps a run almost always live (a job lasts up to 6h)
    - cron: "0 */5 * * *"

concurrency:
  group: proxy-server
  # false, so a new run QUEUES behind the running server instead of
  # killing it. The old run keeps serving until it ends (~5h50m), then
  # the queued run takes over - near-continuous, no restart gaps.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tune kernel (BBR + big buffers)
        run: |
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.ipv4.tcp_fastopen=3 || true

      - name: Download bore
        run: |
          curl -L -o bore.tgz https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          tar xzf bore.tgz && chmod +x bore && ./bore --version

      - name: Start tunnel server on :2525
        env:
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
        run: |
          nohup env PROXY_SECRET="$PROXY_SECRET" python3 server/tunnel_server.py 2525 > srv.log 2>&1 &
          sleep 2
          ss -ltnp 2>/dev/null | grep ':2525' && echo "server up" || { cat srv.log; exit 1; }

      - name: Open bore tunnel
        run: |
          nohup ./bore local 2525 --to bore.pub --port 24601 > bore.log 2>&1 &
          for i in $(seq 1 30); do
            EP=$(grep -oE 'bore\.pub:[0-9]+' bore.log | head -1)
            [ -n "$EP" ] && break; sleep 1
          done
          [ -z "$EP" ] && { echo "no endpoint"; cat bore.log; exit 1; }
          echo "ENDPOINT=$EP"; echo "$EP" > /tmp/ep.txt

      - name: Publish endpoint + keep alive (~5h48m), self-restart before the 6h cap
        env:
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
          # PAT with 'workflow' scope (or fine-grained Actions: read+write) on
          # THIS repo. Needed because a run started by the default GITHUB_TOKEN
          # cannot trigger another run - so we dispatch the successor with a PAT.
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          git config user.name  proxy-bot
          git config user.email proxy-bot@users.noreply.github.com

          publish() {
            git checkout -f main
            git branch -D live 2>/dev/null || true
            git checkout --orphan live
            git reset >/dev/null 2>&1 || true
            printf '{"endpoint":"%s","updated":"%s"}\n' "$1" "$(date -u +%FT%TZ)" > endpoint.json
            git add -f endpoint.json
            git commit -m "endpoint $1" >/dev/null
            git push -f origin live
            git checkout -f main
            echo "published $1"
          }

          # Start the successor run so it is queued and takes over the instant
          # this job exits (concurrency cancel-in-progress:false keeps us alive
          # while it waits). Dispatched ~18 min before the 6h hard cap so the
          # cap can never kill us before the next run is armed.
          dispatch_next() {
            if [ -z "$DISPATCH_PAT" ]; then
              echo "[warn] no DISPATCH_PAT secret - falling back to the 5h schedule only"
              return
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $DISPATCH_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/proxy.yml/dispatches" \
              -d '{"ref":"main"}')
            echo "[self-restart] dispatched successor run -> HTTP $code"
          }

          LAST=$(cat /tmp/ep.txt)
          publish "$LAST"

          armed=0
          for i in $(seq 1 348); do
            pgrep -f "bore local 2525"  >/dev/null || { echo cf-restart;  nohup ./bore local 2525 --to bore.pub --port 24601 >> bore.log 2>&1 & }
            pgrep -f "tunnel_server.py" >/dev/null || { echo srv-restart; nohup env PROXY_SECRET="$PROXY_SECRET" python3 server/tunnel_server.py 2525 >> srv.log 2>&1 & }
            # if bore reconnected on a different port, republish so clients follow
            CUR=$(grep -oE 'bore\.pub:[0-9]+' bore.log | tail -1)
            if [ -n "$CUR" ] && [ "$CUR" != "$LAST" ]; then
              echo "bore port changed: $LAST -> $CUR"
              publish "$CUR"; LAST="$CUR"
            fi
            # arm the next run once, ~18 min before we exit
            if [ "$i" -eq 330 ] && [ "$armed" -eq 0 ]; then
              dispatch_next; armed=1
            fi
            sleep 60
          done
          echo "==== srv.log tail ===="; tail -60 srv.log
