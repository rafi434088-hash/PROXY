<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body {
    width: 240px; margin: 0; padding: 16px;
    font: 14px system-ui, "Segoe UI", Arial, sans-serif;
    background: #ffffff; color: #111827;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1f2937; color: #f3f4f6; }
    .addr { background: #111827; color: #d1d5db; }
  }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .addr {
    font-family: Consolas, monospace; font-size: 12px;
    background: #f3f4f6; border-radius: 6px; padding: 6px 8px; margin: 8px 0 14px;
    direction: ltr; text-align: left;
  }
  .status { font-size: 13px; margin-bottom: 12px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-inline-start: 6px; vertical-align: middle; }
  button {
    width: 100%; padding: 10px; font-size: 14px; font-weight: 600;
    border: 0; border-radius: 8px; cursor: pointer; color: #fff;
  }
  .on  { background: #16a34a; }
  .off { background: #6b7280; }
</style>
</head>
<body>
  <h1>Tsoolgee Proxy</h1>
  <div class="addr">HTTP 127.0.0.1:10809</div>
  <div class="status">מצב: <span id="label">…</span><span id="dot" class="dot"></span></div>
  <button id="toggle">…</button>
  <script src="popup.js"></script>
</body>
</html>
